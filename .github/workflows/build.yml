name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip AuraMatrix_AI.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: auramatrix_ai/app
        run: |
          flutter create . --project-name auramatrix_ai --platforms=android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          echo 'subprojects { afterEvaluate { project.extensions.findByName("android")?.withGroovyBuilder { "compileSdkVersion"(36) } } }' | cat - android/build.gradle.kts > /tmp/b.kts
          mv /tmp/b.kts android/build.gradle.kts
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: AuraMatrix-APK
          path: auramatrix_ai/app/build/app/outputs/flutter-apk/app-release.apk
